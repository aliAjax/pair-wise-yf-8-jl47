<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶片分镜条核对台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">纸质放映胶片 · 试映对片同步核对</p>
          <h1>胶片分镜条核对台</h1>
        </div>
        <div class="hero-stats">
          <div>
            <span>总时长</span>
            <strong id="totalDuration">0:00</strong>
          </div>
          <div>
            <span>已确认同步</span>
            <strong id="syncCount">0</strong>
          </div>
          <div>
            <span>破损片段</span>
            <strong id="damageCount">0</strong>
          </div>
          <div>
            <span>片段数</span>
            <strong id="segmentCount">0</strong>
          </div>
        </div>
      </header>

      <section class="toolbar">
        <label>
          胶片卷
          <input id="reelTitle" type="text" placeholder="例：春日试映A卷" />
        </label>
        <label>
          颜色偏移
          <select id="colorFilter">
            <option value="all">全部</option>
            <option value="正常">正常</option>
            <option value="偏红">偏红</option>
            <option value="偏青">偏青</option>
            <option value="偏黄">偏黄</option>
            <option value="褪色">褪色</option>
          </select>
        </label>
        <label>
          搜索
          <input id="searchInput" type="search" placeholder="编号、片边码或备注" />
        </label>
        <button id="historyBtn">同步历史</button>
        <button id="exportBtn">导出清单</button>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>录入片段</h2>
          <form id="segmentForm" class="segment-form">
            <label>
              片段编号
              <input id="codeInput" required placeholder="A-014" />
            </label>
            <label>
              时长（秒）
              <input id="durationInput" required type="number" min="0.1" step="0.1" value="12" />
            </label>
            <label>
              片边码
              <input id="edgeCodeInput" type="text" placeholder="如 KJ-12940+08（确认前必填）" />
            </label>
            <label>
              声轨偏移（秒，可负）
              <input id="soundOffsetInput" type="number" step="0.1" value="0" />
            </label>
            <label>
              颜色偏移
              <select id="shiftInput">
                <option value="正常">正常</option>
                <option value="偏红">偏红</option>
                <option value="偏青">偏青</option>
                <option value="偏黄">偏黄</option>
                <option value="褪色">褪色</option>
              </select>
            </label>
            <label>
              破损情况
              <select id="damageInput">
                <option value="完好">完好</option>
                <option value="轻微划痕">轻微划痕</option>
                <option value="齿孔破损">齿孔破损</option>
                <option value="接片松动">接片松动</option>
                <option value="需跳过">需跳过</option>
              </select>
            </label>
            <label>
              缩略图
              <input id="thumbInput" type="file" accept="image/*" />
            </label>
            <label>
              备注
              <textarea id="noteInput" rows="4" placeholder="试映前要留意的画面、接片或声音点"></textarea>
            </label>
            <button class="primary" type="submit">加入放映清单</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="panel-head">
            <h2>放映顺序</h2>
            <span>按当前顺序自动累计起止；行内登记片边码与声轨偏移</span>
          </div>
          <div id="segmentList" class="segment-list"></div>
        </section>

        <aside class="panel warning-panel">
          <h2>试映前核对</h2>
          <div id="warningList" class="warning-list"></div>
        </aside>
      </section>

      <footer class="footnote">
        确认同步条件：片边码已填、颜色正常、无破损、时长有效。调整顺序或改动某段时长 / 声轨偏移，该段及之后的确认自动失效；改动片边码或偏色 / 破损标记，该段确认失效。旧确认保留在“同步历史”中，关闭页面再打开数据仍在本机。
      </footer>
    </main>

    <div id="historyModal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <div class="modal-head">
          <h2 id="historyTitle">同步历史</h2>
          <button type="button" id="historyCloseBtn" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div id="historyScope" class="history-scope"></div>
        <div id="historyList" class="history-list"></div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="rules.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
